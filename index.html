<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; manifest-src 'self'; worker-src 'self'; frame-src about:; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#161c26">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Payments</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1a1a1a;--mut:#6b6b6b;--card:#f4f4f2;--line:#d9d9d4;--acc:#1f7a4d;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#ececec;--mut:#a0a0a0;--card:#1e1e1e;--line:#333;--acc:#6fcf97;--bad:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
button,input{font:inherit}
.screen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:12px}
.card h1{margin:0;font-size:1.25rem}
.card p{margin:0;color:var(--mut);font-size:.9rem;line-height:1.4}
input[type=password],input[type=text]{width:100%;padding:.75rem;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.btn{padding:.75rem 1rem;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
@media(prefers-color-scheme:dark){.btn.pri{color:#0b1f14}}
.btn[disabled]{opacity:.55}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;padding:.3rem;font-size:.85rem}
.filelbl{display:block;padding:.75rem 1rem;border-radius:10px;border:1px dashed var(--line);text-align:center;cursor:pointer;color:var(--fg)}
.filelbl input{display:none}
#bar{position:fixed;top:0;left:0;right:0;height:calc(44px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:8px;padding-left:12px;padding-right:12px;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
#bar b{flex:1;font-size:.95rem}
#bar button{padding:.35rem .7rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
#frame{position:fixed;left:0;right:0;bottom:0;top:calc(44px + env(safe-area-inset-top));width:100%;height:calc(100% - 44px - env(safe-area-inset-top));border:0;background:var(--bg)}
#menu{position:fixed;right:10px;top:calc(48px + env(safe-area-inset-top));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;z-index:6;min-width:220px}
#menu button,#menu label{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:.7rem .8rem;border-radius:8px;cursor:pointer;font-size:.95rem}
#menu button:hover,#menu label:hover{background:var(--bg)}
#menu input[type=file]{display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:10px;display:none;z-index:10;font-size:.9rem;max-width:90%}
</style></head><body>
<div id="root"></div>
<div id="modal"><div class="card" id="mcard"></div></div>
<div id="toast"></div>
<script>
(function(){
'use strict';
var LS=window.localStorage,K_META='pv.meta',K_APP='pv.app',K_STATE='pv.state',K_FP='pv.fp';
var ITER=600000,enc=new TextEncoder(),dec=new TextDecoder();
var key=null,meta=null,appHtml='',mem=Object.create(null),chain=Promise.resolve(),timer=null,hiddenAt=0,fails=0;
var root=document.getElementById('root'),modal=document.getElementById('modal'),mcard=document.getElementById('mcard'),toastEl=document.getElementById('toast');

function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function derive(pass,salt,iter){var m=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(k,text){var iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,enc.encode(text)),o=new Uint8Array(12+ct.byteLength);o.set(iv);o.set(new Uint8Array(ct),12);return b64(o)}
async function unseal(k,s){var a=unb64(s),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:a.subarray(0,12)},k,a.subarray(12));return dec.decode(pt)}
function toast(t){toastEl.textContent=t;toastEl.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){toastEl.style.display='none'},3500)}
function readFile(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result))};r.onerror=function(){rej(r.error)};r.readAsText(f)})}
function download(name,text,type){var u=URL.createObjectURL(new Blob([text],{type:type||'application/octet-stream'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function looksLikeApp(h){return /<html/i.test(h)&&/<script/i.test(h)&&h.length>2000}

/* ---- encrypted replacement for localStorage, handed to the app inside the frame ---- */
var shim={
 getItem:function(k){return k in mem?mem[k]:null},
 setItem:function(k,v){mem[k]=String(v);queueSave()},
 removeItem:function(k){delete mem[k];queueSave()},
 clear:function(){mem=Object.create(null);queueSave()},
 key:function(i){return Object.keys(mem)[i]||null},
 get length(){return Object.keys(mem).length}
};
window.__vaultStore=shim;
function queueSave(){clearTimeout(timer);timer=setTimeout(saveNow,400)}
function saveNow(){clearTimeout(timer);if(!key)return chain;chain=chain.then(async function(){try{LS.setItem(K_STATE,await seal(key,JSON.stringify(mem)))}catch(e){toast('Could not save. Export a backup now.')}});return chain}

/* ---- screens ---- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function screen(html){root.innerHTML='<div class="screen"><div class="card">'+html+'</div></div>'}
function $(id){return document.getElementById(id)}

function showSetup(){
 screen('<h1>🔒 Set up your payments app</h1><p>Choose a passcode. Your payments are encrypted with it on this phone. <b>If you forget it, nothing can recover the data</b> (keep a backup).</p>'+
 '<input type="password" id="p1" placeholder="Passcode (6+ characters)" autocomplete="new-password">'+
 '<input type="password" id="p2" placeholder="Type it again" autocomplete="new-password">'+
 '<label class="filelbl" id="flab">Choose your private payments file<input type="file" id="pf" accept=".html,text/html"></label>'+
 '<div class="err" id="err"></div><button class="btn pri" id="go">Create and unlock</button>');
 var file=null;
 $('pf').onchange=function(){file=this.files[0]||null;$('flab').firstChild.nodeValue=file?('Selected: '+file.name):'Choose your private payments file'};
 $('go').onclick=async function(){
  var e=$('err'),p1=$('p1').value,p2=$('p2').value;
  if(p1.length<6){e.textContent='Passcode must be at least 6 characters.';return}
  if(p1!==p2){e.textContent='The two passcodes do not match.';return}
  if(!file){e.textContent='Choose your private payments file first.';return}
  var html=await readFile(file);
  if(!looksLikeApp(html)){e.textContent='That does not look like the payments file.';return}
  $('go').disabled=true;$('go').textContent='Encrypting…';
  try{
   var salt=crypto.getRandomValues(new Uint8Array(16));
   key=await derive(p1,salt,ITER);meta={v:1,salt:b64(salt),iter:ITER};appHtml=html;mem=Object.create(null);
   LS.setItem(K_APP,await seal(key,html));LS.setItem(K_STATE,await seal(key,'{}'));LS.setItem(K_META,JSON.stringify(meta));
   if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
   launch();
  }catch(x){e.textContent='Setup failed: '+x.message;$('go').disabled=false;$('go').textContent='Create and unlock'}
 };
}

async function unlockWith(p){
 meta=JSON.parse(LS.getItem(K_META));
 var k=await derive(p,unb64(meta.salt),meta.iter);
 var html=await unseal(k,LS.getItem(K_APP));
 var st=JSON.parse(await unseal(k,LS.getItem(K_STATE)));
 mem=Object.create(null);Object.keys(st).forEach(function(n){mem[n]=st[n]});
 key=k;appHtml=html;fails=0;launch();
}
function showLock(){
 var hasFp=!!LS.getItem(K_FP)&&!!window.PublicKeyCredential;
 screen('<h1>🔒 Payments</h1><p>Enter your passcode.</p><input type="password" id="pw" placeholder="Passcode" autocomplete="current-password"><div class="err" id="err"></div><button class="btn pri" id="go">Unlock</button>'+(hasFp?'<button class="btn" id="fp">👆 Unlock with fingerprint</button>':'')+'<button class="lnk" id="forgot">Forgot passcode? Erase this phone\'s copy</button>');
 var inp=$('pw');if(!hasFp)setTimeout(function(){inp.focus()},50);
 async function go(){
  var e=$('err'),p=inp.value;if(!p)return;
  $('go').disabled=true;$('go').textContent='Unlocking…';
  if(fails>=3){await new Promise(function(r){setTimeout(r,Math.min(60,Math.pow(2,fails-3))*1000)})}
  try{await unlockWith(p)}
  catch(x){fails++;e.textContent='Wrong passcode.';$('go').disabled=false;$('go').textContent='Unlock';inp.value='';inp.focus()}
 }
 $('go').onclick=go;inp.onkeydown=function(ev){if(ev.key==='Enter')go()};
 if(hasFp)$('fp').onclick=async function(){
  var e=$('err');e.textContent='';
  try{await unlockWith(await fpGetPass())}
  catch(x){e.textContent='Fingerprint did not work. Use your passcode.'}
 };
 $('forgot').onclick=function(){
  if(confirm('This permanently erases the encrypted data stored on this phone. You will need your original payments file (or a backup plus its passcode) to start again. Erase it?')){
   [K_META,K_APP,K_STATE,K_FP].forEach(function(k){LS.removeItem(k)});showSetup()}
 };
}

/* ---- fingerprint unlock (passkey + PRF wraps the passcode) ---- */
async function prfKey(id,salt){
 var a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:'public-key',id:id}],userVerification:'required',timeout:60000,extensions:{prf:{eval:{first:salt}}}}});
 var r=a.getClientExtensionResults().prf;
 if(!r||!r.results||!r.results.first)throw new Error('no prf');
 var m=await crypto.subtle.importKey('raw',r.results.first,'HKDF',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:new Uint8Array(0),info:enc.encode('pv-fp-1')},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function fpGetPass(){var f=JSON.parse(LS.getItem(K_FP));return unseal(await prfKey(unb64(f.id),unb64(f.salt)),f.wrapped)}
async function enableFp(){
 if(!window.PublicKeyCredential){toast('This browser does not support fingerprint unlock.');return}
 var v=await ask('Turn on fingerprint unlock',['Your passcode'],'Continue');
 if(!v)return;
 try{var kk=await derive(v[0],unb64(meta.salt),meta.iter);await unseal(kk,LS.getItem(K_APP))}
 catch(x){modal.style.display='none';toast('Wrong passcode.');return}
 modal.style.display='none';
 try{
  var salt=crypto.getRandomValues(new Uint8Array(32));
  var cred=await navigator.credentials.create({publicKey:{rp:{name:'Payments',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'owner',displayName:'Owner'},challenge:crypto.getRandomValues(new Uint8Array(32)),pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,extensions:{prf:{}}}});
  var id=new Uint8Array(cred.rawId),k=await prfKey(id,salt);
  LS.setItem(K_FP,JSON.stringify({id:b64(id),salt:b64(salt),wrapped:await seal(k,v[0])}));
  toast('Fingerprint unlock is on');
 }catch(x){toast('Could not turn on fingerprint on this phone. Your passcode still works.')}
 fpLabel();
}
function fpLabel(){var b=$('m-fp');if(b)b.textContent=LS.getItem(K_FP)?'Turn off fingerprint unlock':'Turn on fingerprint unlock'}
function fpToggle(){
 if(LS.getItem(K_FP)){if(confirm('Turn off fingerprint unlock? You will use your passcode.')){LS.removeItem(K_FP);fpLabel();toast('Fingerprint unlock is off')}}
 else enableFp();
}

/* ---- unlocked app ---- */
var frame=null;
function launch(){
 root.innerHTML='<div id="bar"><b>🔒 Payments</b><button id="lock">Lock</button><button id="mnu">⋯</button></div>'+
 '<div id="menu"><button id="m-bak">Download encrypted backup</button><label>Restore from backup<input type="file" id="m-res" accept=".pvault,application/json"></label><label>Update app file<input type="file" id="m-upd" accept=".html,text/html"></label><button id="m-fp"></button><button id="m-pass">Change passcode</button></div>';
 var shimScript='<script>(function(){var s=parent.__vaultStore;Object.defineProperty(window,"localStorage",{get:function(){return s},configurable:true});})();<\/script>';
 var out=appHtml.replace(/<head[^>]*>/i,function(m){return m+shimScript});
 if(out===appHtml)out=shimScript+appHtml;
 frame=document.createElement('iframe');frame.id='frame';frame.title='Payments';frame.srcdoc=out;root.appendChild(frame);
 $('lock').onclick=lockNow;
 $('mnu').onclick=function(ev){ev.stopPropagation();var m=$('menu');m.style.display=m.style.display==='block'?'none':'block'};
 document.addEventListener('click',function(){var m=$('menu');if(m)m.style.display='none'});
 $('m-bak').onclick=backup;$('m-res').onchange=restore;$('m-upd').onchange=updateApp;$('m-pass').onclick=changePass;$('m-fp').onclick=fpToggle;fpLabel();
}
async function lockNow(){await saveNow();key=null;location.reload()}

async function backup(){
 await saveNow();
 var o={pv:1,meta:LS.getItem(K_META),app:LS.getItem(K_APP),state:LS.getItem(K_STATE)};
 download('payments-backup-'+today()+'.pvault',JSON.stringify(o));
 toast('Encrypted backup downloaded');
}
async function restore(){
 var f=this.files[0];if(!f)return;
 try{
  var o=JSON.parse(await readFile(f));
  if(!o||o.pv!==1||!o.meta||!o.app||!o.state)throw new Error('bad');
  if(!confirm('Replace everything on this phone with this backup? You will unlock it with the passcode it was made with.'))return;
  await saveNow();
  LS.setItem(K_META,o.meta);LS.setItem(K_APP,o.app);LS.setItem(K_STATE,o.state);LS.removeItem(K_FP);
  key=null;location.reload();
 }catch(x){toast('That is not a valid backup file.')}
}
async function updateApp(){
 var f=this.files[0];if(!f)return;
 var html=await readFile(f);
 if(!looksLikeApp(html)){toast('That does not look like the payments file.');return}
 if(!confirm('Replace the app file? Your saved payments and history stay as they are.'))return;
 try{appHtml=html;LS.setItem(K_APP,await seal(key,html));await saveNow();launch();toast('App file updated')}catch(x){toast('Update failed.')}
}
function ask(title,fields,okLabel){
 return new Promise(function(res){
  mcard.innerHTML='<h1>'+esc(title)+'</h1>'+fields.map(function(f,i){return'<input type="password" id="mf'+i+'" placeholder="'+esc(f)+'" autocomplete="off">'}).join('')+'<div class="err" id="merr"></div><button class="btn pri" id="mok">'+esc(okLabel)+'</button><button class="btn" id="mno">Cancel</button>';
  modal.style.display='flex';
  $('mno').onclick=function(){modal.style.display='none';res(null)};
  $('mok').onclick=function(){res(fields.map(function(_,i){return $('mf'+i).value}))};
 });
}
async function changePass(){
 var v=await ask('Change passcode',['Current passcode','New passcode (6+ characters)','New passcode again'],'Change');
 if(!v)return;
 var e=$('merr');
 try{
  var cur=await derive(v[0],unb64(meta.salt),meta.iter);await unseal(cur,LS.getItem(K_APP));
 }catch(x){e.textContent='Current passcode is wrong.';return changePassRetry()}
 if(v[1].length<6||v[1]!==v[2]){e.textContent='New passcodes must match and be 6+ characters.';return changePassRetry()}
 $('mok').disabled=true;$('mok').textContent='Working…';
 try{
  var salt=crypto.getRandomValues(new Uint8Array(16)),nk=await derive(v[1],salt,ITER),nm={v:1,salt:b64(salt),iter:ITER};
  await saveNow();
  var a=await seal(nk,appHtml),s=await seal(nk,JSON.stringify(mem));
  LS.setItem(K_APP,a);LS.setItem(K_STATE,s);LS.setItem(K_META,JSON.stringify(nm));
  LS.removeItem(K_FP);fpLabel();key=nk;meta=nm;modal.style.display='none';toast('Passcode changed. Turn fingerprint unlock back on in the menu.');
 }catch(x){e.textContent='Failed: '+x.message}
}
function changePassRetry(){setTimeout(changePass,0)}

/* ---- lock automatically after the app has been in the background ---- */
document.addEventListener('visibilitychange',function(){
 if(document.hidden){hiddenAt=Date.now();if(key)saveNow()}
 else if(key&&hiddenAt&&Date.now()-hiddenAt>60000){key=null;location.reload()}
});

/* ---- start ---- */
if(!(window.crypto&&crypto.subtle)){screen('<h1>Not supported</h1><p>This browser cannot do encryption here. Open the page over https in Chrome or Safari.</p>')}
else if(LS.getItem(K_META)&&LS.getItem(K_APP)&&LS.getItem(K_STATE))showLock();
else showSetup();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body></html>
